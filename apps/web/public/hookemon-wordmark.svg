<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 96" fill="none">
  <defs>
    <linearGradient id="hookemon-wordmark-gold" x1="8" y1="15" x2="420" y2="83" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF2A8"/>
      <stop offset="0.42" stop-color="#F6C53A"/>
      <stop offset="0.78" stop-color="#C88812"/>
      <stop offset="1" stop-color="#FFE887"/>
