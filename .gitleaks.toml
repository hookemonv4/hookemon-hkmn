[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Canonical receipt SHA-256 input hashes misclassified as generic API keys"
condition = "AND"
paths = ['''(?:^|/)receipts/r-[0-9]{5}\.json$''']
regexTarget = "line"
regexes = ['''^\s*(?:"decisions/ADR-0002-launchpad-token-issuance\.md": "(?:fe20fd72714625746bd59c7c1d14341496e2bad92ea36bba924cbe11c2c1d95a|4cc79b69d493302b87044e768688b591fbc8418b538b884f3bc73de22480d1a2)"|"docs/modules/token-core\.md": "(?:6a99552ea4f401525dda218ca7f6f0d29ba9b21e1bf37491f260932a68bb38f8|308c53154bb2bae575a005f66270a21dbfb6ded485f313d03f108d8e63dc49ca|99b4318705f44c944268cd2bba928c338c4cf1a18f4e737640c6250618f2246f)"),?\s*$''']

[[rules.allowlists]]
description = "Deterministic pool token-order label misclassified as a generic API key"
condition = "AND"
paths = ['''(?:^|/)feasibility/model\.mjs$''']
regexTarget = "line"
regexes = ['''^\s*tokenOrder: usdgIsCurrency0 \? "USDG_HKMN" : "HKMN_USDG",\s*$''']

[[rules.allowlists]]
description = "Public Solana token mint in the Collector Crypt pack-status test fixture misclassified as a generic API key"
condition = "AND"
paths = ['''(?:^|/)packages/adapters/test/fixtures/collector-crypt/pack-status\.json$''']
regexTarget = "secret"
regexes = ['''^EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v$''']

[[rules.allowlists]]
description = "Public token contract address constant in the Robinhood RPC test misclassified as a generic API key"
condition = "AND"
paths = ['''(?:^|/)packages/adapters/test/robinhood-rpc\.test\.mjs$''']
regexTarget = "secret"
regexes = ['''^0x5fc5360d0400a0fd4f2af552add042d716f1d168$''']

[[rules.allowlists]]
description = "Opt-in live smoke flag in the Collector Crypt adapter card misclassified as a generic API key"
condition = "AND"
paths = ['''(?:^|/)docs/modules/collector-crypt-adapter\.md$''']
regexTarget = "secret"
regexes = ['''^COLLECTOR_CRYPT_LIVE_SMOKE=1$''']

[[rules.allowlists]]
description = "Public Solana address-lookup-table key repeated across Solana transaction test fixtures misclassified as a generic API key"
condition = "AND"
paths = [
  '''(?:^|/)packages/adapters/test/fixtures/transactions/solana-context\.json$''',
  '''(?:^|/)packages/adapters/test/fixtures/transactions/solana-v0-alt-wrong-resolution\.json$''',
]
regexTarget = "secret"
regexes = ['''^5Z6Ay5NEcbg3xhopc522sBCRXQujkTiuDRnHGfQdcnSf$''']

[[rules.allowlists]]
description = "Public Solana token account identifier in the Solana transaction-context test fixture misclassified as a generic API key"
condition = "AND"
paths = ['''(?:^|/)packages/adapters/test/fixtures/transactions/solana-context\.json$''']
regexTarget = "secret"
regexes = ['''^GyGKxMyg1p9SsHfm15MkNUu1u9TN2JtTspcdmrtGUdse$''']

[[rules.allowlists]]
description = "Public Robinhood token contract address (lowercase form) test default misclassified as a generic API key"
condition = "AND"
paths = ['''(?:^|/)packages/adapters/test/app/return\.test\.mjs$''']
regexTarget = "secret"
regexes = ['''^0x5fc5360d0400a0fd4f2af552add042d716f1d168$''']

[[rules.allowlists]]
description = "Public Robinhood token contract address (checksummed form) in release Phase 3 launch inputs and graph draft misclassified as a generic API key"
condition = "AND"
paths = [
  '''(?:^|/)release/phase3/launch-inputs\.json$''',
  '''(?:^|/)release/phase3/package/graph-draft\.json$''',
]
regexTarget = "secret"
regexes = ['''^0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168$''']

[[rules.allowlists]]
description = "Held-position key-set selector ternary in the public cycle-status contract misclassified as a generic API key"
condition = "AND"
paths = ['''(?:^|/)packages/dashboard/src/contracts/public-cycle-status\.mjs$''']
regexTarget = "line"
regexes = ['''^\s*const keys = \(schemaVersion === 5 \|\| schemaVersion === 6\) \? HELD_POSITION_V5_KEYS : HELD_POSITION_V4_KEYS;\s*$''']

[[rules.allowlists]]
description = "Held-position key-set selector ternary in the public community-snapshot contract misclassified as a generic API key"
condition = "AND"
paths = ['''(?:^|/)packages/dashboard/src/contracts/public-community-snapshot\.mjs$''']
regexTarget = "line"
regexes = ['''^\s*const keys = \(schemaVersion === 7 \|\| schemaVersion === 8\) \? HELD_POSITION_V7_KEYS : HELD_POSITION_V6_KEYS;\s*$''']

[[rules.allowlists]]
description = "Public Solana stablecoin mint repeated across the collector-policy rehearsal specimen fixtures misclassified as a generic API key"
condition = "AND"
paths = [
  '''(?:^|/)packages/adapters/rehearsal/collector-policy/specimens/purchase\.json$''',
  '''(?:^|/)packages/adapters/rehearsal/collector-policy/specimens/buyback\.json$''',
]
regexTarget = "secret"
regexes = ['''^EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v$''']

[[rules.allowlists]]
description = "Held-position key-set selector ternary in the imported web copy of the public cycle-status contract misclassified as a generic API key"
condition = "AND"
paths = ['''(?:^|/)apps/web/lib/public-cycle-status\.ts$''']
regexTarget = "line"
regexes = ['''^\s*const keys = schemaVersion === 5 \|\| schemaVersion === 6 \? HELD_POSITION_V5_KEYS : HELD_POSITION_V4_KEYS;\s*$''']

[[rules.allowlists]]
description = "Held-position key-set selector ternary in the imported web copy of the public community-snapshot contract misclassified as a generic API key"
condition = "AND"
paths = ['''(?:^|/)apps/web/lib/public-community-snapshot\.ts$''']
regexTarget = "line"
regexes = ['''^\s*const keys = schemaVersion === 7 \|\| schemaVersion === 8 \? HELD_POSITION_V7_KEYS : HELD_POSITION_V6_KEYS;\s*$''']

[[rules.allowlists]]
description = "Legacy wire-field exception SHA-256 digest declaration in the cleanroom scanner misclassified as a generic API key"
condition = "AND"
paths = ['''(?:^|/)scripts/check-cleanroom\.mjs$''']
regexTarget = "line"
regexes = ['''^\s*const APPROVED_LEGACY_WIRE_FIELD_TOKEN_DIGEST = '8f75379cdcbccf2b9fe6893111101ef5e96bd4d1311adf4cea3add5d1bfdfde4';\s*$''']
