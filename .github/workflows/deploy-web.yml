name: Deploy Hookemon Website

on:
  workflow_run:
    workflows: ["Hookemon CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: hookemon-web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy hookemon-web
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://hookemon.com
    steps:
      - name: Check out the exact CI-approved revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Node.js 22.13.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked website dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build production Worker
        working-directory: apps/web
        run: npm run build

      - name: Verify generated Worker target
        working-directory: apps/web
        run: node scripts/verify-cloudflare-deploy.mjs config dist/server/wrangler.json

      - name: Sync public dashboard Worker bindings
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_DASHBOARD_PROFILE: ${{ secrets.PUBLIC_DASHBOARD_PROFILE }}
          PUBLIC_COMMUNITY_SNAPSHOT_URL: ${{ secrets.PUBLIC_COMMUNITY_SNAPSHOT_URL }}
          FORCE_COLOR: "0"
          WRANGLER_LOG_SANITIZE: "true"
          WRANGLER_SEND_METRICS: "false"
        run: |
          test -n "$PUBLIC_DASHBOARD_PROFILE"
          test -n "$PUBLIC_COMMUNITY_SNAPSHOT_URL"
          printf '%s' "$PUBLIC_DASHBOARD_PROFILE" |
            npx --no-install wrangler secret put PUBLIC_DASHBOARD_PROFILE \
              --config dist/server/wrangler.json
          printf '%s' "$PUBLIC_COMMUNITY_SNAPSHOT_URL" |
            npx --no-install wrangler secret put PUBLIC_COMMUNITY_SNAPSHOT_URL \
              --config dist/server/wrangler.json

      - name: Upload exact CI-approved Worker version
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          FORCE_COLOR: "0"
          WRANGLER_LOG_SANITIZE: "true"
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          WRANGLER_SEND_METRICS: "false"
        run: >-
          npx --no-install wrangler versions upload
          --config dist/server/wrangler.json
          --message "GitHub ${DEPLOY_SHA}"

      - name: Select uploaded Worker version
        id: worker-version
        working-directory: apps/web
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: >-
          node scripts/verify-cloudflare-deploy.mjs version-id
          "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"

      - name: Deploy exact uploaded Worker version
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          FORCE_COLOR: "0"
          WRANGLER_LOG_SANITIZE: "true"
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          WRANGLER_SEND_METRICS: "false"
        run: >-
          npx --no-install wrangler versions deploy
          "${{ steps.worker-version.outputs.version_id }}@100%"
          --config dist/server/wrangler.json
          --yes
          --message "GitHub ${DEPLOY_SHA}"

      - name: Verify structured deployment receipt
        working-directory: apps/web
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: >-
          node scripts/verify-cloudflare-deploy.mjs output
          "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live custom domain
        run: >-
          curl --fail --silent --show-error --location
          --retry 12 --retry-all-errors --retry-delay 5 --max-time 20
          https://hookemon.com/ --output "$RUNNER_TEMP/hookemon-live.html"
