name: deploy-web
on:
  workflow_run:
    workflows: ["Hookemon CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hookemon-web-production
  cancel-in-progress: false
defaults:
  run:
    working-directory: apps/web
jobs:
  deploy-web:
    name: deploy-web
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://hookemon.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify the generated deployment target
        run: node scripts/verify-cloudflare-deploy.mjs config dist/server/wrangler.json
      - name: Sync public dashboard Worker bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_DASHBOARD_PROFILE: ${{ secrets.PUBLIC_DASHBOARD_PROFILE }}
          PUBLIC_COMMUNITY_SNAPSHOT_URL: ${{ secrets.PUBLIC_COMMUNITY_SNAPSHOT_URL }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_DASHBOARD_PROFILE"
          test -n "$PUBLIC_COMMUNITY_SNAPSHOT_URL"
          printf '%s' "$PUBLIC_DASHBOARD_PROFILE" | npx --no-install wrangler secret put PUBLIC_DASHBOARD_PROFILE \
            --config dist/server/wrangler.json
          printf '%s' "$PUBLIC_COMMUNITY_SNAPSHOT_URL" | npx --no-install wrangler secret put PUBLIC_COMMUNITY_SNAPSHOT_URL \
            --config dist/server/wrangler.json
      - name: Upload exact CI-approved Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/hookemon-web-upload.ndjson
        run: npx --no-install wrangler versions upload --config dist/server/wrangler.json
      - name: Select uploaded Worker version
        id: worker-version
        run: >-
          node scripts/verify-cloudflare-deploy.mjs version-id
          "${{ runner.temp }}/hookemon-web-upload.ndjson" >> "$GITHUB_OUTPUT"
      - name: Deploy exact uploaded Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/hookemon-web-deploy.ndjson
        run: npx --no-install wrangler versions deploy "${{ steps.worker-version.outputs.version_id }}@100%" --yes --config dist/server/wrangler.json
      - name: Verify structured deployment receipt
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cat "${{ runner.temp }}/hookemon-web-upload.ndjson" "${{ runner.temp }}/hookemon-web-deploy.ndjson" \
            > "${{ runner.temp }}/hookemon-web-versions.ndjson"
          node scripts/verify-cloudflare-deploy.mjs output "${{ runner.temp }}/hookemon-web-versions.ndjson" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: GitHub ${DEPLOY_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm the public site responds
        run: curl --fail --silent --show-error --output /dev/null https://hookemon.com/
