name: fork-pin-canary
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-pin-canary
  cancel-in-progress: false
jobs:
  canary:
    environment: fork-proof
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require default branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo "fork-pin canary only runs from refs/heads/main." >&2
            exit 1
          }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Node
        shell: bash
        run: |
          set -euo pipefail
          node_version='24.19.0'
          node_url='https://nodejs.org/download/release/v24.19.0/node-v24.19.0-linux-x64.tar.xz'
          node_archive_sha256='14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647'
          node_executable_sha256='bc17c508ffeed0ec622934f9b7fa72f8e78da65350e63c3eceb56fa688aa5e12'
          node_archive="${RUNNER_TEMP}/node-v${node_version}-linux-x64.tar.xz"
          node_root="${RUNNER_TEMP}/node-v${node_version}-linux-x64"
          node_executable="${node_root}/bin/node"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error --output "$node_archive" "$node_url"
          printf '%s  %s\n' "$node_archive_sha256" "$node_archive" | sha256sum --check
          tar -xJf "$node_archive" -C "$RUNNER_TEMP"
          printf '%s  %s\n' "$node_executable_sha256" "$node_executable" | sha256sum --check
          echo "${node_root}/bin" >> "$GITHUB_PATH"
          [[ "$("$node_executable" --version)" == "v${node_version}" ]]
      - name: Observe current-head drift against the pinned archive fork bundle
        shell: bash
        env:
          ROBINHOOD_FORK_RPC_URL: ${{ secrets.ROBINHOOD_FORK_RPC_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${ROBINHOOD_FORK_RPC_URL:-}" ]]; then
            echo "ROBINHOOD_FORK_RPC_URL is required for the current-head canary." >&2
            exit 1
          fi
          verify_regular_git_blob() {
            local path="$1"
            local expected_sha256="$2"
            local metadata listed_path mode type blob_id
            [[ ! -L "$path" && -f "$path" ]]
            metadata="$(git ls-tree HEAD -- "$path")"
            [[ -n "$metadata" ]]
            IFS=$'\t' read -r metadata listed_path <<< "$metadata"
            read -r mode type blob_id <<< "$metadata"
            [[ "$mode" == '100644' && "$type" == 'blob' && "$listed_path" == "$path" ]]
            [[ "$(git hash-object "$path")" == "$blob_id" ]]
            printf '%s  %s\n' "$expected_sha256" "$path" | sha256sum --check
          }
          fork_pin_scripts_verify_fork_pin_mjs_sha256='09249c50f08b092305e497b6a9430d3acab0131c689ce58862f1f700668ef94a'
          fork_pin_scripts_programmable_lib_keccak_mjs_sha256='ce4ea412ddd845b7495fc960f16855a2d5dea62482f224c5dc4cd8aefaede863'
          verify_regular_git_blob 'scripts/verify-fork-pin.mjs' "$fork_pin_scripts_verify_fork_pin_mjs_sha256"
          verify_regular_git_blob 'scripts/programmable/lib/keccak.mjs' "$fork_pin_scripts_programmable_lib_keccak_mjs_sha256"
          report="$(node scripts/verify-fork-pin.mjs)"
          echo "$report"
          fork_status="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(0, "utf8")).status)' <<< "$report")"
          if [[ "$fork_status" != "PASSED" ]]; then
            echo "::error::fork-pin-canary observed drift: status=$fork_status. This branch-local canary is not a required pull-request or push status." >&2
            exit 1
          fi
