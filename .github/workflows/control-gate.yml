name: control-gate
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: control-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GIT_NO_REPLACE_OBJECTS: '1'
jobs:
  pull-request:
    name: control-gate
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Node
        shell: bash
        run: |
          set -euo pipefail
          node_version='24.19.0'
          node_url='https://nodejs.org/download/release/v24.19.0/node-v24.19.0-linux-x64.tar.xz'
          node_archive_sha256='14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647'
          node_executable_sha256='bc17c508ffeed0ec622934f9b7fa72f8e78da65350e63c3eceb56fa688aa5e12'
          node_archive="${RUNNER_TEMP}/node-v${node_version}-linux-x64.tar.xz"
          node_root="${RUNNER_TEMP}/node-v${node_version}-linux-x64"
          node_executable="${node_root}/bin/node"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error --output "$node_archive" "$node_url"
          printf '%s  %s\n' "$node_archive_sha256" "$node_archive" | sha256sum --check
          tar -xJf "$node_archive" -C "$RUNNER_TEMP"
          printf '%s  %s\n' "$node_executable_sha256" "$node_executable" | sha256sum --check
          echo "${node_root}/bin" >> "$GITHUB_PATH"
          [[ "$("$node_executable" --version)" == "v${node_version}" ]]
      - name: Verify candidate control inputs from the protected base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          range_base="$PR_BASE_SHA"
          git cat-file -e "${range_base}^{commit}"
          [[ "$(git rev-parse HEAD)" == "$range_base" ]]
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pull/${PR_NUMBER}/head"
          range_head="$(git rev-parse "refs/remotes/origin/pull/${PR_NUMBER}/head")"
          [[ "$range_head" == "$PR_HEAD_SHA" ]]
          git cat-file -e "${range_head}^{commit}"
          base_control_root="${RUNNER_TEMP}/base-control"
          mkdir -p "${base_control_root}/scripts/lib"
          git show "${range_base}:scripts/verify-control-dependencies.mjs" > "${base_control_root}/scripts/verify-control-dependencies.mjs"
          git show "${range_base}:scripts/lib/util.mjs" > "${base_control_root}/scripts/lib/util.mjs"
          node "${base_control_root}/scripts/verify-control-dependencies.mjs" --base-control "$range_base" "$range_head"
  push:
    name: control-gate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.before == '0000000000000000000000000000000000000000' && github.sha || github.event.before }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Node
        shell: bash
        run: |
          set -euo pipefail
          node_version='24.19.0'
          node_url='https://nodejs.org/download/release/v24.19.0/node-v24.19.0-linux-x64.tar.xz'
          node_archive_sha256='14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647'
          node_executable_sha256='bc17c508ffeed0ec622934f9b7fa72f8e78da65350e63c3eceb56fa688aa5e12'
          node_archive="${RUNNER_TEMP}/node-v${node_version}-linux-x64.tar.xz"
          node_root="${RUNNER_TEMP}/node-v${node_version}-linux-x64"
          node_executable="${node_root}/bin/node"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error --output "$node_archive" "$node_url"
          printf '%s  %s\n' "$node_archive_sha256" "$node_archive" | sha256sum --check
          tar -xJf "$node_archive" -C "$RUNNER_TEMP"
          printf '%s  %s\n' "$node_executable_sha256" "$node_executable" | sha256sum --check
          echo "${node_root}/bin" >> "$GITHUB_PATH"
          [[ "$("$node_executable" --version)" == "v${node_version}" ]]
      - name: Resolve pushed control range
        id: push-range
        shell: bash
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PUSH_HEAD_SHA"
          git show "HEAD:scripts/ci/push-range.mjs" > "$RUNNER_TEMP/push-range.mjs"
          push_range_output="$RUNNER_TEMP/push-range-output"
          : > "$push_range_output"
          node "$RUNNER_TEMP/push-range.mjs" resolve "$PUSH_BASE_SHA" "$PUSH_HEAD_SHA" before "$push_range_output" "$GITHUB_STEP_SUMMARY"
          cat "$push_range_output" >> "$GITHUB_OUTPUT"
      - name: Verify pushed control inputs from the trusted base
        shell: bash
        env:
          RANGE_HEAD: ${{ steps.push-range.outputs.range_head }}
          TRUSTED_BASE: ${{ steps.push-range.outputs.trusted_base }}
        run: |
          set -euo pipefail
          trusted_base="$TRUSTED_BASE"
          range_head="$RANGE_HEAD"
          git cat-file -e "${trusted_base}^{commit}"
          git fetch --no-tags origin "$range_head"
          git cat-file -e "${range_head}^{commit}"
          git checkout --detach "$trusted_base"
          [[ "$(git rev-parse HEAD)" == "$trusted_base" ]]
          base_control_root="${RUNNER_TEMP}/base-control"
          mkdir -p "${base_control_root}/scripts/lib"
          git show "${trusted_base}:scripts/verify-control-dependencies.mjs" > "${base_control_root}/scripts/verify-control-dependencies.mjs"
          git show "${trusted_base}:scripts/lib/util.mjs" > "${base_control_root}/scripts/lib/util.mjs"
          node "${base_control_root}/scripts/verify-control-dependencies.mjs" --base-control "$trusted_base" "$range_head"
