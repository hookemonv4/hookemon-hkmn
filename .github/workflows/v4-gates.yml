name: v4-gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: v4-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Node
        shell: bash
        run: |
          set -euo pipefail
          node_version='24.19.0'
          node_url='https://nodejs.org/download/release/v24.19.0/node-v24.19.0-linux-x64.tar.xz'
          node_archive_sha256='14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647'
          node_executable_sha256='bc17c508ffeed0ec622934f9b7fa72f8e78da65350e63c3eceb56fa688aa5e12'
          node_archive="${RUNNER_TEMP}/node-v${node_version}-linux-x64.tar.xz"
          node_root="${RUNNER_TEMP}/node-v${node_version}-linux-x64"
          node_executable="${node_root}/bin/node"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error --output "$node_archive" "$node_url"
          printf '%s  %s\n' "$node_archive_sha256" "$node_archive" | sha256sum --check
          tar -xJf "$node_archive" -C "$RUNNER_TEMP"
          printf '%s  %s\n' "$node_executable_sha256" "$node_executable" | sha256sum --check
          echo "${node_root}/bin" >> "$GITHUB_PATH"
          [[ "$("$node_executable" --version)" == "v${node_version}" ]]
      - name: Transitional base commit identity check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export GIT_NO_REPLACE_OBJECTS=1
          # Remove this step only after the owner registers identity-gate and control-gate as required statuses on main.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range_base="$PR_BASE_SHA"
            range_head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            range_base="$PUSH_BASE_SHA"
            range_head="$PUSH_HEAD_SHA"
          else
            echo "unsupported event: $EVENT_NAME" >&2
            exit 1
          fi
          git cat-file -e "${range_base}^{commit}"
          git cat-file -e "${range_head}^{commit}"
          git show "${range_base}:scripts/check-commit-identity.mjs" > "$RUNNER_TEMP/check-commit-identity.mjs"
          node "$RUNNER_TEMP/check-commit-identity.mjs" "$range_base" "$range_head"
      - name: Install pinned Foundry
        shell: bash
        run: |
          set -euo pipefail
          foundry_version='1.7.1'
          foundry_commit='4072e48705af9d93e3c0f6e29e93b5e9a40caed8'
          foundry_url='https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz'
          foundry_archive_sha256='cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b'
          foundry_executable_sha256='4f77da0810de94325734855d0ad58d70640aa8a5b2a837608ddf8c26da34355c'
          foundry_archive="${RUNNER_TEMP}/foundry_v${foundry_version}_linux_amd64.tar.gz"
          foundry_root="${RUNNER_TEMP}/foundry-v${foundry_version}-linux-amd64"
          foundry_executable="${foundry_root}/forge"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error --output "$foundry_archive" "$foundry_url"
          printf '%s  %s\n' "$foundry_archive_sha256" "$foundry_archive" | sha256sum --check
          mkdir -p "$foundry_root"
          tar -xzf "$foundry_archive" -C "$foundry_root"
          printf '%s  %s\n' "$foundry_executable_sha256" "$foundry_executable" | sha256sum --check
          foundry_version_output="$("$foundry_executable" --version)"
          [[ "$foundry_version_output" == *"Version: ${foundry_version}"* ]]
          [[ "$foundry_version_output" == *"Commit SHA: ${foundry_commit}"* ]]
          echo "$foundry_root" >> "$GITHUB_PATH"
      - name: Verify control dependency pins
        run: node scripts/verify-control-dependencies.mjs
      - name: Verify the test manifest covers every test file
        run: node scripts/test-manifest.mjs check
      - name: Verify deterministic state projection
        run: |
          node scripts/v4.mjs status --check
          git diff --exit-code -- STATE.md state.json
      - run: node scripts/v4.mjs trace check
      - run: node scripts/check-cleanroom.mjs .
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          gitleaks_version='8.30.1'
          gitleaks_url='https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          gitleaks_archive_sha256='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          gitleaks_executable_sha256='88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509'
          gitleaks_config_sha256='b35dc0878da8330f3de5c3854c0833fa8af599ae5482f0e2a0a4eef27442f029'
          gitleaks_archive="${RUNNER_TEMP}/gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          gitleaks_root="${RUNNER_TEMP}/gitleaks-${gitleaks_version}"
          gitleaks_executable="${gitleaks_root}/gitleaks"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error --output "$gitleaks_archive" "$gitleaks_url"
          printf '%s  %s\n' "$gitleaks_archive_sha256" "$gitleaks_archive" | sha256sum --check
          mkdir -p "$gitleaks_root"
          tar -xzf "$gitleaks_archive" -C "$gitleaks_root"
          printf '%s  %s\n' "$gitleaks_executable_sha256" "$gitleaks_executable" | sha256sum --check
          printf '%s  %s\n' "$gitleaks_config_sha256" '.gitleaks.toml' | sha256sum --check
          echo "$gitleaks_root" >> "$GITHUB_PATH"
          [[ "$("$gitleaks_executable" version)" == "$gitleaks_version" ]]
      - name: Check commit range and secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          append_only_options=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range_base="$PR_BASE_SHA"
            range_head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            range_base="$PUSH_BASE_SHA"
            range_head="$PUSH_HEAD_SHA"
            append_only_options=(--require-ancestor)
          else
            echo "unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

          git cat-file -e "${range_base}^{commit}"
          git cat-file -e "${range_head}^{commit}"
          node scripts/check-append-only.mjs "$range_base" "$range_head" "${append_only_options[@]}"

          empty_ignore="${RUNNER_TEMP}/gitleaks-empty-ignore"
          : > "$empty_ignore"

          # Synthetic negative control includes an inline allow marker; hardened scanning must still find it.
          negative_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks-negative.XXXXXX")"
          negative_report="${RUNNER_TEMP}/gitleaks-negative.json"
          printf 'github_token = "%s%s" # gitleaks:allow\n' \
            'ghp_' '1a2B3c4D5e6F7g8H9i0J1k2L3m4N5o6P7q8R' \
            > "${negative_dir}/control.txt"
          mkdir -p "${negative_dir}/receipts"
          printf '{\n  "service_token": "%s%s",\n  "docs/modules/token-core.md": "%s%s"\n}\n' \
            'dH7mQ2vR9xK4pT8c' 'N6wB1yL5fJ0sA3zE' \
            'cb857a0bfcb6322cd73f4959a3905d23' '3762f1dada3b7ca31e17df08fecb516c' \
            > "${negative_dir}/receipts/r-99999.json"
          set +e
          gitleaks dir --no-banner --redact --ignore-gitleaks-allow \
            --config .gitleaks.toml --gitleaks-ignore-path "$empty_ignore" \
            --report-format json --report-path "$negative_report" "$negative_dir"
          negative_status=$?
          set -e
          if [[ "$negative_status" -ne 1 || ! -s "$negative_report" ]]; then
            echo "Gitleaks synthetic negative control failed" >&2
            exit 1
          fi
          node -e 'const fs = require("node:fs"); const findings = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const tokenCoreFinding = findings.some(finding => finding.RuleID === "generic-api-key" && finding.File.endsWith("/receipts/r-99999.json") && finding.StartLine === 3); if (!findings.some(finding => finding.RuleID === "github-pat") || !tokenCoreFinding) process.exit(1)' "$negative_report"

          tracked_tree="$(mktemp -d "${RUNNER_TEMP}/gitleaks-tree.XXXXXX")"
          git archive HEAD | tar -x -C "$tracked_tree"
          gitleaks dir --no-banner --redact --ignore-gitleaks-allow \
            --config .gitleaks.toml --gitleaks-ignore-path "$empty_ignore" \
            "$tracked_tree"
          gitleaks git --no-banner --redact --ignore-gitleaks-allow \
            --config .gitleaks.toml --gitleaks-ignore-path "$empty_ignore" \
            --log-opts="--full-history -m --text --no-textconv $range_base..$range_head" .
      - name: Verify delivery boundary
        run: node scripts/check-delivery-boundary.mjs
      - name: Verify local Phase 2 runner
        shell: bash
        run: |
          files="$(node scripts/test-manifest.mjs list runner)"
          node --test --test-timeout=120000 $files
          node packages/runner/src/cycle/verify-fixtures.mjs
      - name: Verify adapters dependencies
        shell: bash
        run: |
          cd packages/adapters
          npm ci --ignore-scripts
          cd - >/dev/null
          files="$(node scripts/test-manifest.mjs list adapters)"
          node --test --test-timeout=120000 $files
      - name: Verify dashboard suite
        shell: bash
        run: |
          files="$(node scripts/test-manifest.mjs list dashboard)"
          node --test --test-timeout=120000 $files
      - name: Initialize pinned top-level contract dependencies
        run: git submodule update --init packages/contracts/lib/v4-core packages/contracts/lib/v4-periphery
      - name: Verify Phase 1 build pins
        run: >-
          node --input-type=module --eval
          'import { validateBuildPins } from "./feasibility/verify-robinhood-binding.mjs";
          console.log(JSON.stringify({ status: "VERIFIED_BUILD_PINS", buildPins: validateBuildPins(process.cwd()) }, null, 2));'
      - name: Initialize pinned contract dependency closure
        run: |
          git -C packages/contracts/lib/v4-core submodule update --init --recursive
          git -C packages/contracts/lib/v4-periphery submodule update --init lib/permit2
      - name: Initialize pinned launch dependencies
        run: git submodule update --init packages/contracts/lib/liquidity-launcher packages/contracts/lib/uerc20-factory
      - name: Verify Phase 1 contracts
        run: |
          FOUNDRY_LIBS='["lib/v4-core"]' forge fmt --check --root packages/contracts
          FOUNDRY_LIBS='["lib/v4-core","lib/v4-periphery"]' forge test --root packages/contracts --match-path 'test/bindings/*.t.sol' -vvv
          FOUNDRY_LIBS='["lib/v4-core"]' forge test --root packages/contracts --match-path 'test/market/*.t.sol' -vvv
          node feasibility/verify-robinhood-binding.mjs bindings/robinhood-chain.json --offline
      - name: Verify local Phase 2 contracts
        shell: bash
        run: |
          FOUNDRY_LIBS='["lib/v4-core","lib/v4-periphery"]' forge test --root packages/contracts --ffi -vv --no-match-path 'test/integration/RobinhoodV4ArchiveFork.t.sol'
          files="$(node scripts/test-manifest.mjs list contracts-abi)"
          FOUNDRY_LIBS='["lib/v4-core"]' node --test --test-timeout=120000 $files
      - name: Verify contracts-js suite
        shell: bash
        run: |
          files="$(node scripts/test-manifest.mjs list contracts-js)"
          node --test --test-timeout=120000 $files
      - name: Verify scripts suite
        shell: bash
        run: |
          files="$(node scripts/test-manifest.mjs list scripts)"
          node --test --test-timeout=120000 $files
      - name: Verify Phase 3 launch package draft
        run: node scripts/programmable/verify-launch-package.mjs --allow-unverified
      - name: Verify release package closure
        run: node scripts/verify-release-package-closure.mjs
